<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .con {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item {
            border: 4px solid black;
            border-radius: 10px;
            padding: 30px;
            margin-top: 30px;
            background-color: blue;
            color: white;
            width: 100%;
            max-width: 700px;
            max-height: max-content;
        }

        h1,
        h3 {
            margin-top: 20px;
            text-align: center;
        }

        h3 {
            margin-top: 20px;
            color: orange;
        }

        .sin,
        .log {
            display: flex;
            justify-content: center;

        }

        button a {
            text-decoration: none;
            color: black;
            font-weight: bolder;
        }

        button {
            width: 40%;
            font-size: x-large;
            margin: 30px;
            padding: 20px;
            border: 3px solid red;
            border-radius: 10px;
        }

        @media (max-width:700px) {
            button {
                margin:20px;
                width:50%;
            }
        }
        @media (min-height:600px){
            .i2{
                margin-top: 0px;
            }
        }
        .head{
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .i2 {      
            width: 100%;
            text-align: center;     
            background-color: blue;
            margin: 20px;
            padding: 10px;
            color: white;
            margin-top: 150px;
            max-width: 750px;
            border-radius: 30px;
        }

        h6 {
            font-size: xx-large;
        }
    </style>
</head>

<body>
    <div class="head">
    <div class="i2">
        <h6>DASHBOARD</h6>
    </div>
    </div>

    <div class="con">
        <div class="item">
            <h1>WELCOME TO ALL THIS WEBSITE</h1>
            <h3>DHAMODHIRAN V</h3>

            <div class="sin">
                <button><a href="/sign">SIGN UP</a></button>
                <button><a href="/log">LOGIN</a></button>
            </div>
            <div class="log">

            </div>

        </div>
    </div>

</body>

</html>
