<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .con {
            margin:10px ;
            display: flex;
            justify-content: center;
            margin: 10px;         
        }

        .item{
            padding: 40px;
            margin-top: 100px;
            border-radius: 20px;
            color: white;
            background-color: black;
            padding: 20px;
            margin-right: 20px;
            margin-left: 20px;   
        }
        caption{
            font-size: xx-large;
            font-weight: bolder;
            margin: 30px;
        }
        th,td{
            padding: 20px;
            margin: 10px;
            font-size: x-large;
        }
        form{
            display: flex;
            justify-content: center;
        }
        button{
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: larger;
            font-weight: bolder;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="con">
        <div class="item">
            <form action="/home">
                <button type="submit">BACK</button>
            </form>
            
            <table border="3px">
               
                <caption>HISTORY</caption>
                <tr>
                    <th>name</th>
                    <th>history</th>
                    <th>datetime</th>
                </tr>
                 {% for i in dataset %}
                <tr>
                    <td>{{ i.0 }}</td>
                    <td>{{ i.1 }}</td>
                    <td>{{ i.2 }}</td>
                </tr>
               
                
                {% endfor %}
            </table>
        </div>
    </div>

    </h1>

</body>

</html>
